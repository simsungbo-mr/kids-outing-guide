name: Daily KOPIS Kids Outing Sync

on:
  schedule:
    # 매일 한국시간(KST) 오전 7:00 (UTC 22:00) 자동 실행
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-kopis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch live KOPIS kids performances and merge places.json
        env:
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
        run: python3 scripts/daily_sync.py

      - name: Commit and push updated data/places.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/places.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily KOPIS kids performances sync ($(date +'%Y-%m-%d'))"
            git push
          fi
